<style>

<body>
<header><h1>Batch Cooking — recettes protéinées</h1><p>Plats au four + desserts/collations • quantités recalculées automatiquement • liste de courses</p></header>
<main>
<section id="catalog">
  <div class="toolbar">
    <button class="filter active" data-cat="Tous">Tous</button>
    <button class="filter" data-cat="Plats">Plats</button>
    <button class="filter" data-cat="Desserts / Collations">Desserts / Collations</button>
    <input id="search" class="select" placeholder="Rechercher un aliment…" style="padding:9px 12px;border:1px solid var(--line);border-radius:999px;flex:1;min-width:220px">
  </div>
  <div id="grid" class="grid"></div>
</section>
<section id="detail">
  <button class="filter back" onclick="showCatalog()">← Retour aux recettes</button>
  <div class="panel">
    <div class="detail-head"><div><span id="dtag" class="tag"></span><h2 id="dtitle"></h2><div id="dmeta" class="meta"></div></div><button class="print" onclick="window.print()">Imprimer</button></div>
    <div id="dvisual" class="detail-visual"></div>
    <div id="controls" class="controls"></div>
    <div id="quantityGuide" class="quantity-guide"></div><div id="nutritionBox" class="nutrition-box"></div>
    <div id="variantBox"></div>
    <div class="cols">
      <div><h3>Ingrédients</h3><ul id="ingredients" class="ingredients"></ul><div id="note"></div></div>
      <div><h3>Préparation</h3><div id="steps"></div><h3>Liste de courses</h3><div id="shopping" class="shopping"></div></div>
    </div>
  </div>
</section>
</main>

 base dans 4 récipients en verre compatibles four. Ajouter : bowl 1 = 160 g poulet + 30 g quinoa ; bowl 2 = 150 g bœuf 5 % + 30 g lentilles corail ; bowl 3 = 200 g cabillaud + 30 g riz basmati ; bowl 4 = 200 g tofu ferme + 30 g boulgour. Couvrir de papier cuisson et cuire ensemble.", "note": "Température et durée proposées car absentes de la source. Les récipients doivent être explicitement compatibles avec le four et éviter tout choc thermique.", "variants": {"Poulet + quinoa": [["Poulet", "160", "g"], ["Quinoa cru", "30", "g"]], "Bœuf + lentilles": [["Bœuf haché 5 %", "150", "g"], ["Lentilles corail crues", "30", "g"]], "Cabillaud + riz": [["Cabillaud", "200", "g"], ["Riz basmati cru", "30", "g"]], "Tofu + boulgour": [["Tofu ferme", "200", "g"], ["Boulgour cru", "30", "g"]]}}, {"title": "Gaufres courgette", "category": "Desserts / Collations", "servings": 3, "time": "10–15 min", "temp": "Gaufrier", "ingredients": [["Courgette pelée", "1", "pièce"], ["Œufs", "2", "pièce"], ["Farine d’avoine", "80", "g"]], "seasoning": "Curry ou cumin, sel, poivre", "steps": "Mixer tous les ingrédients. Cuire dans un gaufrier jusqu’à obtenir des gaufres dorées. Version salée : cottage cheese, saumon fumé, tomates, ciboulette. Version sucrée-salée : cottage cheese + 1 c. à soupe de beurre de cacahuète.", "note": "3 gaufres ; environ 160 kcal et 9 g de protéines par gaufre selon la source."}, {"title": "One pot pasta poulet tomate", "category": "Plats", "servings": 4, "time": "35–45 min (est.)", "temp": "200 °C (est.)", "ingredients": [["Pâtes complètes crues", "200", "g"], ["Blanc de poulet", "500", "g"], ["Courgettes", "500", "g"], ["Oignon rouge", "1", "pièce"], ["Pulpe de tomate", "400", "g"], ["Concentré de tomate", "2", "c. à café"], ["Eau", "300", "ml"], ["Feta", "150", "g"], ["Mozzarella râpée", "50", "g"]], "seasoning": "Sel, ail en poudre, curry", "steps": "Mettre tous les ingrédients dans un plat allant au four et mélanger. Proposition : couvrir pour les 25 premières minutes, puis découvrir et poursuivre 10–20 min. Vérifier que les pâtes sont tendres et le poulet bien cuit.", "note": "Température, durée et couverture proposées car absentes de la source. La source annonce environ 47 g de protéines par portion."}, {"title": "Crumble fruits protéiné", "category": "Desserts / Collations", "servings": 3, "time": "20 min + 4 h de repos", "temp": "160 puis 200 °C", "ingredients": [["Pomme", "1", "pièce"], ["Poire", "1", "pièce"], ["Banane", "1", "pièce"], ["Flocons d’avoine", "90", "g"], ["Œufs", "3", "pièce"], ["Beurre de cacahuète", "50", "g"], ["Whey vanille", "30", "g"], ["Miel", "1", "c. à café"]], "seasoning": "Cannelle", "steps": "Répartir les fruits dans 3 ramequins avec cannelle et miel. Cuire 10 min à 160 °C. Émietter la croûte pour former des clusters, puis cuire 10 min à 200 °C. Laisser refroidir et réfrigérer au moins 4 h.", "note": "Environ 23 g de protéines par portion selon la source."}, {"title": "One pot pasta poulet épinards", "category": "Plats", "servings": 4, "time": "35–45 min (est.)", "temp": "200 °C (est.)", "ingredients": [["Pâtes complètes", "200", "g"], ["Blanc de poulet", "500", "g"], ["Épinards", "300", "g"], ["Tomates pelées", "400", "g"], ["Coulis de tomate", "200", "g"], ["Eau", "300", "ml"], ["Cottage cheese", "250", "g"], ["Cheddar", "40", "g"]], "seasoning": "Sel, poivre, curry", "steps": "Mettre les pâtes, poulet, tomates, coulis et eau dans un plat. Proposition : cuire à 200 °C environ 35–45 min, mélanger à mi-cuisson, puis ajouter les épinards, le cottage cheese et le cheddar en fin de cuisson.", "note": "Cuisson au four proposée car la température et la durée ne sont pas indiquées. La source annonce environ 470 kcal, 49 g protéines, 44 g glucides et 10 g lipides par portion."}, {"title": "Gâteau chocolat courgette", "category": "Desserts / Collations", "servings": 5, "time": "25–30 min", "temp": "180 °C", "ingredients": [["Courgette", "1", "pièce"], ["Œufs", "2", "pièce"], ["Beurre de cacahuète", "30", "g"], ["Pépites de chocolat", "20", "g"]], "seasoning": "", "steps": "Mixer la courgette, les œufs et le beurre de cacahuète. Ajouter les pépites. Verser dans un moule et cuire 25–30 min à 180 °C. Laisser refroidir.", "note": "Environ 91 kcal, 4,7 g protéines, 4,8 g glucides et 6,3 g lipides par part selon la source."}, {"title": "Pasta bowl poulet légumes", "category": "Plats", "servings": 4, "time": "35–45 min (adaptation four, est.)", "temp": "200 °C (adaptation, est.)", "ingredients": [["Spaghetti complets", "200", "g"], ["Blanc de poulet", "400", "g"], ["Carottes", "400", "g"], ["Champignons", "200", "g"], ["Oignon", "100", "g"], ["Épinards", "300", "g"], ["Tomates pelées", "400", "g"], ["Feta", "200", "g"], ["Lait de coco léger", "150", "ml"], ["Eau", "200", "ml"]], "seasoning": "Sel, poivre, paprika, curry", "steps": "Mettre les ingrédients dans un grand plat, à l’exception des épinards et de la feta. Cuire 35–45 min à 200 °C en mélangeant à mi-cuisson. Ajouter les épinards en fin de cuisson, puis la feta. Mélanger pour obtenir une sauce crémeuse.", "note": ""}, {"title": "Granola patate douce", "category": "Desserts / Collations", "servings": 8, "time": "25 min", "temp": "170 puis 200 °C", "ingredients": [["Patate douce cuite", "300", "g"], ["Flocons d’avoine", "200", "g"], ["Beurre de cacahuète", "50", "g"], ["Sirop d’érable", "50", "g"], ["Whey vanille", "60", "g"]], "seasoning": "", "steps": "Mélanger tous les ingrédients. Cuire 10 min à 170 °C. Former des clusters puis poursuivre 15 min à 200 °C. Laisser refroidir complètement.", "note": "La source ne donne pas le nombre de portions. 8 portions est une proposition de base de calcul pour permettre la conversion des quantités."}, {"title": "Muffins courgette banane", "category": "Desserts / Collations", "servings": 9, "time": "18–22 min (est.)", "temp": "180 °C (est.)", "ingredients": [["Courgette", "200", "g"], ["Banane", "1", "pièce"], ["Œufs", "2", "pièce"], ["Poudre d’amande", "50", "g"], ["Whey vanille VITASTRONG", "30", "g"]], "seasoning": "Garniture au choix : myrtilles, framboises ou pépites de chocolat", "steps": "Mélanger les ingrédients, répartir dans 9 moules à muffins et cuire environ 18–22 min à 180 °C. Vérifier la cuisson au centre.", "note": "Temps et température proposés car absents de la source. La quantité de garniture n’est pas fournie ; elle reste libre."}, {"title": "Brownie express protéiné", "category": "Desserts / Collations", "servings": 1, "time": "2 min", "temp": "Micro-ondes", "ingredients": [["Œuf", "1", "pièce"], ["Yaourt grec", "100", "g"], ["Cacao non sucré", "10", "g"], ["Whey vanille", "30", "g"], ["Miel ou sirop d’érable", "1", "c. à café"]], "seasoning": "", "steps": "Mélanger tous les ingrédients dans un bol. Cuire 2 min au micro-ondes. Adapter de quelques secondes selon la puissance de l’appareil.", "note": "Environ 290 kcal et 42 g de protéines selon la source."}, {"title": "Mini quiches bœuf ou poulet", "category": "Plats", "servings": 4, "time": "30 min", "temp": "200 °C", "ingredients": [["Œufs", "2", "pièce"], ["Skyr 0 %", "250", "g"], ["Mozzarella râpée", "20", "g"]], "seasoning": "Sel, poivre, paprika pour bœuf ; curry, sel, poivre pour poulet", "steps": "Base commune pour 4 portions. Version bœuf : 150 g de bœuf haché 5 % + 150 g d’épinards. Version poulet : 150 g de poulet + 200 g de courgette. Proposition : répartir la base dans les moules, ajouter la garniture choisie, mélanger, parsemer de mozzarella et cuire 30 min à 200 °C.", "note": "La recette donne 2 portions bœuf/épinards et 2 portions poulet/courgette. Le choix de garniture est disponible dans le sélecteur.", "variants": {"Bœuf + épinards": [["Bœuf haché 5 %", "150", "g"], ["Épinards", "150", "g"]], "Poulet + courgette": [["Blanc de poulet", "150", "g"], ["Courgette", "200", "g"]]}}, {"title": "One pot batch cooking", "category": "Plats", "servings": 4, "time": "À définir", "temp": "À définir", "ingredients": [], "seasoning": "", "steps": "La source indique seulement : tous les ingrédients dans un seul plat, cuisson au four, environ 4 portions (possibilité annoncée de 5–6) et recette riche en protéines.", "note": "Fiche volontairement signalée comme incomplète : la liste d’ingrédients n’a pas été fournie, donc aucune quantité n’est inventée ici."}, {"title": "Batch cooking poulet & légumes", "category": "Plats", "servings": 4, "time": "30–35 min (proposition)", "temp": "200 °C (proposition)", "ingredients": [["Blanc de poulet", "500", "g"], ["Pommes de terre", "500", "g"], ["Concombre", "1", "pièce"], ["Carottes", "3", "pièce"], ["Tomates", "3", "pièce"], ["Oignon rouge", "1", "pièce"], ["Avocat", "1", "pièce"], ["Sucrine", "1", "pièce"], ["Abricots", "2", "pièce"], ["Skyr", "250", "g"], ["Moutarde", "1", "c. à soupe"], ["Citron", "1/2", "pièce"], ["Miel", "1", "c. à café"], ["Sauce soja", "1", "c. à soupe"]], "seasoning": "Curry, cumin, sel, poivre, un peu d’huile d’olive", "steps": "Proposition : cuire le poulet assaisonné 20–25 min à 200 °C. Cuire les pommes de terre en quartiers environ 30–35 min à 200 °C. Préparer séparément les crudités et la sauce skyr/moutarde/citron/miel/soja. Conserver les éléments séparés et composer les assiettes au moment du repas.", "note": "Les quantités de légumes, sauce, température et temps n’étaient pas précisés : les valeurs affichées sont des propositions pour 4 repas."}, {"title": "One pot poulet moutarde", "category": "Plats", "servings": 4, "time": "40–45 min", "temp": "200 °C", "kcal": 475, "protein": 43, "ingredients": [["Blanc de poulet", "600", "g"], ["Pommes de terre", "900", "g"], ["Champignons", "400", "g"], ["Crème légère 12 %", "200", "g"], ["Moutarde de Dijon", "40", "g"], ["Oignon", "150", "g"], ["Huile d’olive", "10", "g"]], "seasoning": "Sel, poivre, ail, thym", "steps": "Couper les pommes de terre en petits quartiers et les déposer dans un grand plat. Ajouter oignon et champignons. Mélanger la crème, la moutarde et les épices, puis enrober le poulet de cette sauce. s + skyr donne une texture de flan gratiné, sans être sèche."}, {"title": "One pot poulet curry coco", "category": "Plats", "servings": 4, "time": "40–45 min", "temp": "190 °C", "kcal": 515, "protein": 43, "ingredients": [["Blanc de poulet", "600", "g"], ["Riz basmati cru", "220", "g"], ["Lait de coco léger", "300", "ml"], ["Tomates concassées", "400", "g"], ["Poivron", "200", "g"], ["Oignon", "150", "g"], ["Petits pois", "150", "g"], ["Eau", "250", "ml"], ["Huile d’olive", "10", "g"]], "seasoning": "Curry, paprika, ail, sel, poivre", "steps": "Dans un grand plat, mélanger le riz cru, tomates, lait de coco, eau, oignon et poivron. Ajouter le poulet en morceaux et les petits pois. Couvrir hermétiquement avec un couvercle ou du papier aluminium et cuire 30 min à 190 °C. Mélanger, vérifier la cuisson du riz et poursuivre 10–15 min si nécessaire. Laisser reposer 5 min avant de servir.", "note": "Environ 515 kcal et 43 g de protéines par portion. Le lait de coco et la tomate forment une sauce qui évite un riz sec."}, {"title": "One pot poulet fajitas", "category": "Plats", "servings": 4, "time": "40–45 min", "temp": "200 °C", "kcal": 538, "protein": 49, "ingredients": [["Blanc de poulet", "600", "g"], ["Riz basmati cru", "220", "g"], ["Poivrons", "400", "g"], ["Tomates concassées", "400", "g"], ["Oignon rouge", "150", "g"], ["Cheddar râpé", "60", "g"], ["Skyr", "150", "g"], ["Eau", "300", "ml"], ["Huile d’olive", "10", "g"]], "seasoning": "Paprika fumé, cumin, ail, piment doux, sel", "steps": "Mélanger le riz cru, les tomates et l’eau dans le plat. Ajouter les poivrons et l’oignon émincés puis le poulet en dés fortement assaisonné. Couvrir et cuire 30 min à 200 °C. Mélanger, ajouter le cheddar et poursuivre 8–10 min découvert. Servir avec une cuillerée de skyr assaisonné au citron.", "note": "Environ 538 kcal et 49 g de protéines par portion. Le skyr apporte une touche fraîche et crémeuse sans alourdir le plat."}, {"title": "One pot gnocchi poulet pesto", "category": "Plats", "servings": 4, "time": "30–35 min", "temp": "200 °C", "kcal": 537, "protein": 46, "ingredients": [["Blanc de poulet", "600", "g"], ["Gnocchi", "450", "g"], ["Courgettes", "500", "g"], ["Tomates cerises", "300", "g"], ["Fromage frais léger", "150", "g"], ["Pesto", "50", "g"], ["Parmesan", "20", "g"], ["Eau", "100", "ml"]], "seasoning": "Sel, poivre, ail, basilic", "steps": "Mettre les gnocchi, les courgettes en demi-rondelles, les tomates et le poulet en morceaux dans un plat. Mélanger le fromage frais, le pesto et l’eau puis répartir dessus. Cuire 25 min à 200 °C. Mélanger, parsemer de parmesan et gratiner encore 5–10 min.", "note": "Environ 537 kcal et 46 g de protéines par portion. Les gnocchi cuisent directement dans la sauce crémeuse."}, {"title": "Gratin poulet parmesan", "category": "Plats", "servings": 4, "time": "40–45 min", "temp": "200 °C", "kcal": 542, "protein": 51, "ingredients": [["Blanc de poulet", "600", "g"], ["Aubergine", "500", "g"], ["Tomates concassées", "500", "g"], ["Mozzarella", "100", "g"], ["Panko ou chapelure", "50", "g"], ["Pâtes crues", "180", "g"], ["Parmesan", "20", "g"], ["Eau", "250", "ml"], ["Huile d’olive", "10", "g"]], "seasoning": "Sel, poivre, ail, origan", "steps": "Mettre les pâtes, tomates et eau au fond du plat. Ajouter l’aubergine en dés et le poulet assaisonné. Cuire couvert 30 min à 200 °C. Mélanger puis répartir mozzarella, parmesan et chapelure sur le dessus. Ajouter un filet d’huile et gratiner 10–15 min découvert.", "note": "Environ 542 kcal et 51 g de protéines par portion. Le gratin croustillant apporte le côté gourmand sans nécessiter de friture."}, {"title": "One pot shakshuka pois chiches", "category": "Plats", "servings": 4, "time": "40–45 min", "temp": "200 °C", "kcal": 470, "protein": 19, "ingredients": [["Œufs", "8", "pièce"], ["Pois chiches cuits égouttés", "400", "g"], ["Pommes de terre", "500", "g"], ["Tomates concassées", "700", "g"], ["Poivron", "300", "g"], ["Oignon", "150", "g"], ["Feta", "80", " s courgettes. Ajouter le poulet en morceaux et assaisonner. Couvrir et cuire 30 min à 190 °C. Mélanger, vérifier que le quinoa est tendre, puis ajouter la mozzarella. Cuire encore 8–10 min découvert pour gratiner.", "note": "Environ 510 kcal et 49 g de protéines par portion. La tomate et le fromage évitent un quinoa sec."}, {"title": "Gratin lentilles corail poulet feta", "category": "Plats", "servings": 4, "time": "40–45 min", "temp": "190 °C", "kcal": 485, "protein": 48, "ingredients": [["Blanc de poulet", "600", "g"], ["Lentilles corail crues", "180", "g"], ["Tomates concassées", "500", "g"], ["Épinards", "300", "g"], ["Skyr", "250", "g"], ["Feta", "80", "g"], ["Oignon", "150", "g"], ["Eau", "300", "ml"], ["Huile d’olive", "10", "g"]], "seasoning": "Cumin, paprika, ail, origan, sel, poivre", "steps": "Mettre les lentilles, tomates, eau, oignon et épinards dans un plat. Ajouter le poulet en petits morceaux et les épices. Couvrir et cuire 30 min à 190 °C. Mélanger, incorporer le skyr, puis émietter la feta dessus. Poursuivre 8–10 min découvert.", "note": "Environ 485 kcal et 48 g de protéines par portion. Le skyr apporte une texture crémeuse sans rendre le plat lourd."}, {"title": "One pot quinoa poulet courgette chèvre", "category": "Plats", "servings": 4, "time": "40–45 min", "temp": "190 °C", "kcal": 500, "protein": 49, "ingredients": [["Blanc de poulet", "600", "g"], ["Quinoa cru", "190", "g"], ["Courgettes", "600", "g"], ["Tomates cerises", "300", "g"], ["Fromage de chèvre", "80", "g"], ["Fromage frais léger", "100", "g"], ["Oignon", "120", "g"], ["Eau", "350", "ml"], ["Huile d’olive", "10", "g"]], "seasoning": "Herbes de Provence, ail, poivre, sel", "steps": "Mettre le quinoa rincé, les courgettes, tomates, oignon et eau dans un grand plat. Ajouter le poulet en dés et assaisonner. Couvrir et cuire 30 min à 190 °C. Mélanger avec le fromage frais, répartir le chèvre et poursuivre 8–10 min découvert.", "note": "Environ 500 kcal et 49 g de protéines par portion. Le duo fromage frais + chèvre apporte le côté gourmand sans avoir besoin de beaucoup de matière grasse."}, {"title": "One pot dahl lentilles corail poulet", "category": "Plats", "servings": 4, "time": "40 min", "temp": "190 °C", "kcal": 495, "protein": 47, "ingredients": [["Blanc de poulet", "600", "g"], ["Lentilles corail crues", "180", "g"], ["Tomates concassées", "400", "g"], ["Lait de coco léger", "250", "ml"], ["Épinards", "250", "g"], ["Oignon", "150", "g"], ["Eau", "250", "ml"], ["Huile d’olive", "10", "g"]], "seasoning": "Curry, curcuma, cumin, gingembre, ail, sel", "steps": "Mettre tous les ingrédients sauf les épinards dans un grand plat et mélanger. Couvrir hermétiquement et cuire 30 min à 190 °C. Mélanger, ajouter les épinards et poursuivre 8–10 min découvert. Laisser reposer quelques minutes pour que les lentilles finissent d’épaissir la sauce.", "note": "Environ 495 kcal et 47 g de protéines par portion. Version très saucée, pratique si tu veux éviter les plats secs."}, {"title": "One pot quinoa mexicain poulet cheddar", "category": "Plats", "servings": 4, "time": "40–45 min", "temp": "200 °C", "kcal": 525, "protein": 50, "ingredients": [["Blanc de poulet", "600", "g"], ["Quinoa cru", "190", "g"], ["Haricots rouges cuits égouttés", "240", "g"], ["Maïs", "150", "g"], ["Tomates concassées", "500", "g"], ["Poivrons", "300", "g"], ["Cheddar râpé", "60", "g"], ["Eau", "250", "ml"], ["Huile d’olive", "10", "g"]], "seasoning": "Paprika fumé, cumin, ail, piment doux, sel, poivre", "steps": "Mettre le quinoa rincé, tomates et eau dans un grand plat. Ajouter poivrons, haricots, maïs et poulet en dés. Assaisonner, couvrir et cuire 30 min à 200 °C. Mélanger, ajouter le cheddar et poursuivre 8–10 min découvert.", "note": "Environ 525 kcal et 50 g de protéines par portion. Un plat façon burrito bowl, mais tout cuit ensemble au four."}, {"title": "One pot lentilles corail œufs feta", "category": "Plats", "servings": 4, "time": "40–45 min", "temp": "200 °C", "kcal": 470, "protein": 25, "ingredients": [["Lentilles corail crues", "180", "g"], ["Œufs", "8", "pièce"], ["Tomates concassées", "600", "g"], ["Poivron rouge", "300", "g"], ["Courgette", "400", "g"], ["Feta", "100", "g"], ["Oignon", "150", "g"], ["Eau", "300", "ml"], ["Huile d’olive", "10", "g"]], "seasoning": "Cumin, paprika fumé, ail, piment doux, sel, poivre", "steps": "Mettre les lentilles, tomates, eau, poivron, courgette et oignon dans un plat. Cuire couvert 25–30 min à 200 °C. Mélanger puis former 8 creux et casser les œufs dedans. Parsemer de feta et remettre 8–10 min, jusqu’à ce que les blancs soient pris. Laisser reposer 5 min.", "note": "Environ 470 kcal et 25 g de protéines par portion. Option végétarienne complète et bien en sauce."}, {"title": "One pot quinoa pesto poulet mozzarella", "category": "Plats", "servings": 4, "time": "35–40 min", "temp": "200 °C", "kcal": 535, "protein": 50, "ingredients": [["Blanc de poulet", "600", "g"], ["Quinoa cru", "180", "g"], ["Courgettes", "500", "g"], ["Tomates cerises", "350", "g"], ["Pesto", "50", "g"], ["Mozzarella", "100", "g"], ["Fromage frais léger", "100", "g"], ["Eau", "350", "ml"], ["Huile d’olive", "5", "g"]], "seasoning": "Ail, basilic, poivre, sel", "steps": "Mettre le quinoa rincé, courgettes, tomates et eau dans le plat. Ajouter le poulet en morceaux et assaisonner. Mélanger le pesto avec le fromage frais puis répartir sur le plat. Couvrir et cuire 25–30 min à 200 °C. Mélanger, ajouter la mozzarella et gratiner 8–10 min découvert.", "note": "Environ 535 kcal et 50 g de protéines par portion. Le pesto et la mozzarella donnent une vraie sensation de plat gourmand."}];

 {"title":"Cheesecake skyr fruits rouges","category":"Desserts / Collations","servings":4,"time":"30–35 min + refroidissement","temp":"170 °C","kcal":185,"protein":18,"ingredients":[["Skyr","400","g"],["Œufs","2","pièce"],["Compote de pommes sans sucre ajouté","120","g"],["Maïzena","20","g"],["Fruits rouges surgelés","200","g"],["Biscuits avoine","40","g"]],"seasoning":"Vanille, zeste de citron, édulcorant ou un peu de miel si besoin","steps":"Écraser les biscuits au fond d'un petit moule. Mélanger skyr, œufs, compote, maïzena et vanille. Verser sur la base, répartir les fruits rouges et cuire 30–35 min à 170 °C. Laisser refroidir puis placer au réfrigérateur quelques heures.","note":"Environ 185 kcal et 18 g de protéines par portion. Texture façon cheesecake, mais beaucoup plus légère."},
 {"title":"Baked oats banane chocolat","category":"Desserts / Collations","servings":4,"time":"25–30 min","temp":"180 °C","kcal":230,"protein":13,"ingredients":[["Banane mûre","2","pièce"],["Flocons d’avoine","120","g"],["Œufs","2","pièce"],["Skyr","150","g"],["Cacao non sucré","15","g"],["Pépites de chocolat noir","30","g"],["Lait demi-écrémé","100","ml"]],"seasoning":"Vanille, cannelle, levure chimique","steps":"Écraser les bananes puis mélanger avec les œufs, le skyr et le lait. Ajouter avoine, cacao, levure et la moitié des pépites. Verser dans un petit plat, ajouter le reste des pépites et cuire 25–30 min à 180 °C.","note":"Environ 230 kcal et 13 g de protéines par portion. Se conserve plusieurs jours au réfrigérateur et se réchauffe très bien."},
 {"title":"Crumble pomme cannelle skyr","category":"Desserts / Collations","servings":4,"time":"30 min","temp":"180 °C","kcal":210,"protein":12,"ingredients":[["Pommes","500","g"],["Flocons d’avoine","80","g"],["Skyr","250","g"],["Poudre d’amande","30","g"],["Beurre de cacahuète","25","g"],["Sirop d’érable","20","g"]],"seasoning":"Cannelle, vanille","steps":"Couper les pommes et les placer dans un plat avec la cannelle. Mélanger avoine, poudre d’amande, beurre de cacahuète et sirop d’érable pour former un crumble. Répartir sur les pommes et cuire 25 min à 180 °C. Servir avec le skyr bien froid.","note":"Environ 210 kcal et 12 g de protéines par portion. Le skyr remplace une crème ou une boule de glace."},

const aliases={"bœuf haché 5 %":"boeuf hache 5 %","œufs":"oeufs","œuf":"oeuf","épinards":"epinards","pâtes crues":"pates crues","pâtes complètes crues":"pates completes crues","pâtes complètes":"pates completes","farine d’avoine":"farine d avoine","flocons d’avoine":"flocons d avoine","flocons d’avoine mixés":"flocons d avoine mixes","maïzena":"maisena","poudre d’amande":"poudre d amande","beurre de cacahuète":"beurre de cacahuete","whey vanille VITASTRONG":"whey vanille vitastrong","sirop d’érable":"sirop d erable","compote de pommes sans sucre ajouté":"compote de pommes sans sucre ajoute","courgette pelée":"courgette pelee","tomates pelées":"tomates pelees","tomates concassées":"tomates concassees","concentré de tomate":"concentre de tomate","lait demi-écrémé":"lait demi-ecreme","crème légère 12 %":"creme legere 12 %","haricots rouges cuits égouttés":"haricots rouges cuits egouttes","pois chiches cuits égouttés":"pois chiches cuits egouttes","huile d’olive":"huile d olive","moutarde de Dijon":"moutarde de dijon","miel ou sirop d’érable":"miel ou sirop d erable","mozzarella râpée":"mozzarella rapee","cheddar râpé":"cheddar rape","fromage de chèvre":"fromage de chevre","pépites de chocolat noir":"pepites de chocolat noir","pépites de chocolat":"pepites de chocolat noir","fruits rouges surgelés":"fruits rouges surgeles"};
function foodKey(name){const n=norm(name);const a=aliases[name]||aliases[n]||n;if(nutrition[a])return a;const keys=Object.keys(nutrition);return keys.sort((a,b)=>b.length-a.length).find(k=>n===k||n.includes(k))||null}
function macroFor(r,selectedVariant=null){let kcal=0,p=0,f=0,c=0;const pieceWeight={"œuf":50,"œufs":50,"oeuf":50,"oeufs":50,"banane":120,"banane mûre":120,"pomme":150,"pommes":150,"poire":160,"courgette":250,"courgettes":250,"courgette pelée":250,"oignon":100,"oignon rouge":100,"carotte":70,"carottes":70,"poivron rouge":150,"poivrons":150,"poivron":150,"avocat":150,"sucrine":150,"abricots":40,"citron":120};const add=a=>(a||[]).forEach(x=>{const q=parseFloat(x[1]),key=foodKey(x[0]);if(!key||!Number.isFinite(q))return;let grams=q,u=norm(x[2]||"");if(u.includes("pièce"))grams=q*(pieceWeight[norm(x[0])]||50);else if(u.includes("c. à soupe"))grams=q*15;else if(u.includes("c. à café"))grams=q*5;else if(u.includes("spray"))grams=5;else if(u.includes("petite tasse"))grams=0;const n=nutrition[key],factor=grams/100;kcal+=n[0]*factor;p+=n[1]*factor;f+=n[2]*factor;c+=n[3]*factor});add(r.ingredients);if(r.variants&&selectedVariant)add(r.variants[selectedVariant]);const s=r.servings||1;return{kcal:Math.round(kcal/s),p:Math.round(p/s),f:Math.round(f/s),c:Math.round(c/s)}}
function usefulNote(note){if(!note)return "";const n=norm(note);return /source|proposition|propose|adaptation|absente|non précise|incomplète|volontairement signalée|quantité.*fournie|température.*durée.*propos/.test(n)?"":note}
let current=null, portions=1, variant=null, filter="Tous";
const $=id=>document.getElementById(id);
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
const photos={chicken:"https://images.unsplash.com/photo-1778851793893-10f3c1c3e11a?auto=format&fit=crop&w=1200&q=82",lentil:"https://images.unsplash.com/photo-1756821753226-c0fc88056cf7?auto=format&fit=crop&w=1200&q=82",sweet:"https://images.unsplash.com/photo-1741112480266-62def497fa27?auto=format&fit=crop&w=1200&q=82",chocolate:"https://images.unsplash.com/photo-1645805740318-31bb7604ffd9?auto=format&fit=crop&w=1200&q=82",cheesecake:"https://images.unsplash.com/photo-1724952727574-49fe24cd5dcc?auto=format&fit=crop&w=1200&q=82",crumble:"https://images.unsplash.com/photo-1605698802040-b783f33b49a5?auto=format&fit=crop&w=1200&q=82"};
function photoFor(r){const t=norm(r.title+" "+(r.ingredients||[]).map(x=>x[0]).join(" "));if(t.includes("crumble")||t.includes("pomme")||t.includes("clafoutis"))return photos.crumble;if(t.includes("cheesecake")||t.includes("fruits rouges"))return photos.cheesecake;if(t.includes("chocolat")||t.includes("brownie")||t.includes("cacao"))return photos.chocolate;if(t.includes("patate douce"))return photos.sweet;if(t.includes("lentille corail")||t.includes("dahl")||t.includes("lentilles"))return photos.lentil;if(t.includes("poulet")||t.includes("pasta")||t.includes("pâtes")||t.includes("quinoa"))return photos.chicken;return r.category==="Plats"?photos.chicken:photos.cheesecake}
function visualFor(r){return '<img src="'+photoFor(r)+'" alt="'+r.title+'" loading="lazy">'}
function render(){
 const q=norm($("search").value||"");
 const list=recipes.filter(r=>(filter==="Tous"||r.category===filter)&&(!q||(r.ingredients||[]).some(x=>norm(x[0]).includes(q))));
 $("grid").innerHTML=list.map((r,i)=>`<article class="card" onclick="openRecipe(${recipes.indexOf(r)})"><div class="card-img"><span>${visualFor(r)}</span></div><div class="card-body"><span class="tag">${r.category}</span><h2>${r.title}</h2><div class="meta">${r.servings} portion(s) • ${r.time} • ${r.temp} • ${macroFor(r).kcal} kcal • ${macroFor(r).p} g prot. • ${macroFor(r).f} g lip. • ${macroFor(r).c} g gluc.</div></div></article>`).join("")||'<div class="empty">Aucune recette avec cet aliment.</div>';
}
document.querySelectorAll(".filter").forEach(b=>{if(b.dataset.cat)b.onclick=()=>{filter=b.dataset.cat;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}})
$("search").addEventListener("input",render);

function openRecipe(i){
 current=recipes[i]; portions=current.servings; variant=Object.keys(current.variants||{})[0]||null;
 $("catalog").style.display="none";$("detail").style.display="block";
 $("dtag").textContent=current.category;$("dtitle").textContent=current.title;
 const m=macroFor(current); $("dmeta").textContent=`Base : ${current.servings} portion(s) • ${current.time} • ${current.temp} • ${m.kcal} kcal • ${m.p} g protéines • ${m.f} g lipides • ${m.c} g glucides / portion`;
 $("dvisual").innerHTML=visualFor(current);
 const vals=[1,2,3,4,current.servings];
 const unique=[...new Set(vals.filter(x=>x>0))];
 $("controls").innerHTML=`<div><b>Nombre de portions :</b></div><div class="portion">${unique.map(n=>`<button onclick="setPortions(${n})" id="p${n}">${n}</button>`).join("")}</div><input id="customPortions" type="number" min="1" value="${portions}" onchange="setPortions(this.value)"><span class="small">ou saisir un nombre</span>`;
 renderDetail();
}
function setPortions(n){n=Math.max(1,parseInt(n)||1);portions=n;document.querySelectorAll(".portion button").forEach(b=>b.classList.remove("active"));let b=$("p"+n);if(b)b.classList.add("active");$("customPortions").value=n;renderDetail()}
function fmt(n){if(Math.abs(n-Math.round(n))<1e-9)return String(Math.round(n));return String(Math.round(n*100)/100).replace(".",",")}
function renderDetail(){
 const scale=portions/current.servings;
 let items=(current.ingredients||[]).map(x=>[x[0],parseFloat(x[1]),x[2]]);
 if(current.variants && variant) items=items.concat(current.variants[variant].map(x=>[x[0],parseFloat(x[1]),x[2]]));
 const baseItems=(current.ingredients||[]).map(x=>[x[0],parseFloat(x[1]),x[2]]).concat(current.variants&&variant?current.variants[variant].map(x=>[x[0],parseFloat(x[1]),x[2]]):[]);
 const m=macroFor(current); $("nutritionBox").innerHTML=`<h3 style="margin:0 0 9px">Macros nutritionnelles <span class="small">(par portion)</span></h3><div class="nutrition-grid"><div class="nutrition-item"><div class="nutrition-value">${m.kcal}</div><div class="nutrition-label">kcal</div></div><div class="nutrition-item"><div class="nutrition-value">${m.p} g</div><div class="nutrition-label">protéines</div></div><div class="nutrition-item"><div class="nutrition-value">${m.f} g</div><div class="nutrition-label">lipides</div></div><div class="nutrition-item"><div class="nutrition-value">${m.c} g</div><div class="nutrition-label">glucides</div></div></div>`;\n $("quantityGuide").innerHTML=baseItems.length?`<h3>Repère des quantités</h3><table class="quantity-table"><thead><tr><th>Ingrédient</th><th>Pour 1</th><th>Pour ${current.servings}</th></tr></thead><tbody>${baseItems.map(x=>`<tr><td>${x[0]}</td><td>${fmt(x[1]/current.servings)} ${x[2]}</td><td>${fmt(x[1])} ${x[2]}</td></tr>`).join("")}</tbody></table>`:"";
 $("variantBox").innerHTML=current.variants?`<label><b>Variante :</b> <select class="variant" onchange="variant=this.value;renderDetail()">${Object.keys(current.variants).map(v=>`<option ${v===variant?"selected":""}>${v}</option>`).join("")}</select></label>`:"";
 $("ingredients").innerHTML=items.length?items.map(x=>`<li><span class="qty">${fmt(x[1]*scale)} ${x[2]}</span> — ${x[0]}</li>`).join(""):"<li class='empty'>Ingrédients non fournis.</li>";
 $("steps").innerHTML=`<p>${current.steps}</p>`;
 const clean=usefulNote(current.note); $("note").innerHTML=clean?`<div class="note">${clean}</div>`:"";
 if(items.length){
   const groups={};items.forEach(x=>{const k=norm(x[0]);if(!groups[k])groups[k]={name:x[0],qty:0,unit:x[2]};groups[k].qty+=x[1]*scale});
   $("shopping").innerHTML=Object.values(groups).map(x=>`<label class="shop-item"><input type="checkbox"><span>${fmt(x.qty)} ${x.unit} — ${x.name}</span></label>`).join("");
 }else $("shopping").innerHTML="<div class='empty'>Liste de courses indisponible pour cette fiche : ingrédients non fournis.</div>";
}
function showCatalog(){$("detail").style.display="none";$("catalog").style.display="block";render()}
render();
</script>
